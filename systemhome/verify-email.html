<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar correo - SYSTEMHOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b1f3a;--tech:#0e7490;--cyan:#22d3ee;--turq:#2dd4bf;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:460px;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(11,31,58,.14);overflow:hidden}
    .top{background:linear-gradient(135deg,var(--navy),var(--tech));padding:26px 30px;color:#fff}
    .top h1{margin:0;font-family:Outfit,sans-serif;font-size:22px;letter-spacing:.4px}
    .top p{margin:6px 0 0;font-size:13px;opacity:.85}
    .body{padding:28px 30px 32px}
    .state{font-size:15px;line-height:1.65;margin:0 0 16px}
    .state strong{color:var(--navy)}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--tech);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{padding:12px 14px;border-radius:9px;font-size:14px;line-height:1.55;margin:14px 0 0;display:none}
    .msg.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .msg.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px;color:#334155}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;outline:none}
    input:focus{border-color:var(--tech);box-shadow:0 0 0 3px rgba(14,116,144,.12)}
    button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--tech),var(--turq));color:#fff;font-weight:700;font-size:14px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .actions{margin-top:22px;display:none}
    .actions a{display:block;text-align:center;color:var(--tech);font-size:14px;text-decoration:none;font-weight:700;padding:12px;border:1px solid var(--line);border-radius:9px}
    .hint{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <h1>SYSTEMHOME</h1>
      <p>Verificación de correo electrónico</p>
    </div>
    <div class="body">
      <p class="state" id="state"><span class="spinner"></span> Verificando su correo. No cierre esta ventana.</p>
      <div class="msg" id="msg"></div>

      <div id="resendBox" style="display:none;">
        <p class="hint">Si el enlace venció o no se pudo completar, escriba el correo con el que se registró y le enviaremos uno nuevo.</p>
        <label for="email">Correo electrónico registrado</label>
        <input type="email" id="email" placeholder="su-correo@ejemplo.com" autocomplete="email">
        <button type="button" id="resendBtn">Reenviar enlace de verificación</button>
      </div>

      <div class="actions" id="actions">
        <a href="/">Ir a iniciar sesión</a>
      </div>
    </div>
  </div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get('token') || '';
  const $ = id => document.getElementById(id);
  const state = $('state');
  const msg = $('msg');
  const actions = $('actions');
  const resendBox = $('resendBox');

  function show(text, ok) {
    state.innerHTML = ok ? '<strong>Correo verificado correctamente.</strong>' : 'No se pudo verificar el correo.';
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    actions.style.display = 'block';
  }

  async function verify() {
    if (!token) {
      show('El enlace no incluye el código de verificación. Solicite uno nuevo.', false);
      resendBox.style.display = 'block';
      return;
    }
    try {
      const resp = await fetch('/api/auth/verify-email?token=' + encodeURIComponent(token));
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || 'Enlace inválido o expirado');
      show('Ya puede iniciar sesión con su usuario y contraseña. ' + (data.message || ''), true);
    } catch (err) {
      show(err.message + ' Si usted ya hizo clic en el enlace anteriormente, intente ingresar igualmente; de lo contrario solicite uno nuevo.', false);
      resendBox.style.display = 'block';
    }
  }

  $('resendBtn').addEventListener('click', async function () {
    const email = $('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = 'Ingrese un correo electrónico válido.';
      msg.className = 'msg err';
      return;
    }
    this.disabled = true;
    try {
      const resp = await fetch('/api/auth/resend-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || 'No se pudo reenviar el correo');
      msg.textContent = (data.message || 'Si la cuenta existe y está pendiente, enviamos un nuevo enlace.') + ' Revise su bandeja de entrada y spam.';
      msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg err';
    } finally {
      this.disabled = false;
    }
  });

  verify();
})();
</script>
</body>
</html>
