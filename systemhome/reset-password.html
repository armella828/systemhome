<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contrasena - SYSTEMHOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b1f3a;--tech:#0e7490;--cyan:#22d3ee;--turq:#2dd4bf;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:440px;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(11,31,58,.14);overflow:hidden}
    .top{background:linear-gradient(135deg,var(--navy),var(--tech));padding:26px 30px;color:#fff}
    .top h1{margin:0;font-family:Outfit,sans-serif;font-size:22px;letter-spacing:.4px}
    .top p{margin:6px 0 0;font-size:13px;opacity:.85}
    .body{padding:28px 30px 32px}
    label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px;color:#334155}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;outline:none}
    input:focus{border-color:var(--tech);box-shadow:0 0 0 3px rgba(14,116,144,.12)}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--tech),var(--turq));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:13px;display:none}
    .msg.ok{display:block;background:#ecfdf5;color:#065f46}
    .msg.err{display:block;background:#fef2f2;color:#991b1b}
    a{color:var(--tech);font-size:13px;text-decoration:none;font-weight:600}
    .foot{text-align:center;margin-top:20px}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <h1>SYSTEMHOME</h1>
      <p>Restablecer contrasena</p>
    </div>
    <div class="body">
      <div id="phase1">
        <p style="color:var(--muted);font-size:14px;line-height:1.6;margin:0">Ingresa la nueva contrasena para tu cuenta.</p>
        <label for="pass">Nueva contrasena</label>
        <input type="password" id="pass" placeholder="Minimo 8 caracteres" autocomplete="new-password">
        <label for="pass2">Confirmar contrasena</label>
        <input type="password" id="pass2" placeholder="Repite la contrasena" autocomplete="new-password">
        <button id="btn">Guardar nueva contrasena</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="foot"><a href="/">Volver al inicio de sesion</a></div>
    </div>
  </div>
<script>
const qs=new URLSearchParams(location.search);
const token=qs.get('token')||'';
const $=id=>document.getElementById(id);
function show(text,ok){const m=$('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err');}
if(!token){show('Enlace invalido: falta el token.','false');$('btn').disabled=true;}
$('btn').onclick=async()=>{
  const p=$('pass').value,c=$('pass2').value;
  if(p.length<8)return show('La contrasena debe tener al menos 8 caracteres.',false);
  if(p!==c)return show('Las contrasenas no coinciden.',false);
  $('btn').disabled=true;
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});
    const j=await r.json();
    if(!r.ok)return show(j.error||'No se pudo cambiar la contrasena.',false);
    show('Contrasena actualizada correctamente. Redirigiendo...',true);
    setTimeout(()=>location.href='/',1800);
  }catch(e){show('Error de conexion con el servidor.',false);$('btn').disabled=false;}
};
</script>
</body>
</html>
